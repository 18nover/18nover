logLevel: error
logDestinations: [stdout]
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 1024
udpMaxPayloadSize: 1452

authMethod: jwt
authJWTJWKS: http://controller:8080/.well-known/jwks.json
authJWTIssuer: https://invalid.example
authJWTAudience: mediamtx

api: yes
apiAddress: :9997
metrics: no
pprof: no
playback: no

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: no
hls: no
srt: no

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigins: ["https://invalid.example"]
webrtcTrustedProxies: []
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: ["invalid.example"]

pathDefaults:
  source: publisher
  sourceOnDemand: no
  rtspTransport: tcp
  rtspAnyPort: no
  overridePublisher: no
  maxReaders: 100

paths: {}
