name: lockard-live-relay

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /config:size=16m,mode=0700
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      RELAY_PUBLIC_HOST: ${RELAY_PUBLIC_HOST:?set RELAY_PUBLIC_HOST}
      SITES_ORIGIN: ${SITES_ORIGIN:?set SITES_ORIGIN}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    networks:
      - edge
      - control
    depends_on:
      controller:
        condition: service_healthy
      mediamtx:
        condition: service_healthy

  mediamtx:
    image: lockard-mediamtx:1.19.3-redirect-guard
    build:
      context: ./mediamtx
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 96
    mem_limit: 1g
    cpus: 2.0
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    environment:
      MTX_AUTHJWTISSUER: https://${RELAY_PUBLIC_HOST:?set RELAY_PUBLIC_HOST}
      MTX_WEBRTCADDITIONALHOSTS: ${RELAY_PUBLIC_HOST:?set RELAY_PUBLIC_HOST}
      MTX_WEBRTCALLOWORIGINS: ${SITES_ORIGIN:?set SITES_ORIGIN}
    ports:
      - "8189:8189/udp"
      - "8189:8189/tcp"
    networks:
      - edge
      - control
    healthcheck:
      test: ["CMD-SHELL", "wget -qS -O /dev/null http://127.0.0.1:9997/v3/paths/list 2>&1 | grep -q '401'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  controller:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: false
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 160
    mem_limit: 4g
    cpus: 4.0
    stop_grace_period: 15s
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - relay_data:/var/lib/lockard
    secrets:
      - db_master_key
      - relay_hmac_keys
      - relay_jwt_private_key
    environment:
      PORT: "8080"
      RELAY_DB_PATH: /var/lib/lockard/relay.sqlite
      RELAY_DB_MASTER_KEY_FILE: /run/secrets/db_master_key
      RELAY_HMAC_KEYS_FILE: /run/secrets/relay_hmac_keys
      RELAY_JWT_PRIVATE_KEY_FILE: /run/secrets/relay_jwt_private_key
      RELAY_JWT_ISSUER: https://${RELAY_PUBLIC_HOST:?set RELAY_PUBLIC_HOST}
      RELAY_JWT_AUDIENCE: mediamtx
      RELAY_PUBLIC_ORIGIN: https://${RELAY_PUBLIC_HOST:?set RELAY_PUBLIC_HOST}
      RELAY_SITES_ORIGIN: ${SITES_ORIGIN:?set SITES_ORIGIN}
      MEDIAMTX_API_ORIGIN: http://mediamtx:9997
      MEDIAMTX_RTSP_ORIGIN: rtsp://mediamtx:8554
      MEDIAMTX_WHEP_ORIGIN: http://mediamtx:8889
      RELAY_ALLOWED_CAMERA_PORTS: ${RELAY_ALLOWED_CAMERA_PORTS:-554,8554}
      RELAY_MAX_CAMERAS: "8"
      RELAY_MAX_WARM_CAMERAS: "4"
      RELAY_MAX_TRANSCODERS: "2"
    networks:
      - control
      - camera_egress
    depends_on:
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

networks:
  edge: {}
  control:
    internal: true
  camera_egress: {}

volumes:
  relay_data: {}
  caddy_data: {}

secrets:
  db_master_key:
    file: ./secrets/db_master_key
  relay_hmac_keys:
    file: ./secrets/relay_hmac_keys.json
  relay_jwt_private_key:
    file: ./secrets/relay_jwt_private_key.pem
